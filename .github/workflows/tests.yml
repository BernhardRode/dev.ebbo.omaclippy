name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Quip bank and prompt logic
        run: node tests/quips.test.js

      - name: QML parser when available on the runner
        run: |
          if command -v qmlformat >/dev/null; then
            # Panel.qml contains Quickshell's typed IpcHandler methods. The
            # standalone Qt parser doesn't know that extension (qmlformat=1,
            # qmllint=255), while the remaining QML is standard syntax.
            for file in BarWidget.qml ClippyCharacter.qml QuipService.qml assets/model/Clippy.qml; do
              qmlformat "$file" >/dev/null
            done
          fi
          if command -v qmllint >/dev/null; then
            for file in BarWidget.qml ClippyCharacter.qml QuipService.qml assets/model/Clippy.qml; do
              qmllint "$file"
            done
          fi

      - name: Omarchy plugin validation when available on the runner
        run: |
          if command -v omarchy >/dev/null; then
            omarchy plugin validate .
          fi
