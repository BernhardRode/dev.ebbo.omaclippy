name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

# Fully automatic releases in ONE workflow run (no reliance on re-triggering):
#
# 1. release-please creates/updates the "chore(main): release x.y.z" PR.
# 2. If one is open, we check out its head, run the test suite against it,
#    and merge it. A red suite leaves the PR open for the next push.
# 3. Because a GITHUB_TOKEN merge does not trigger further workflows
#    (GitHub's recursion guard), we immediately fetch the merged main and
#    run release-please again right here -- which is what turns the merged
#    release commit into the git tag + GitHub Release.
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Create or update the release PR / cut releases from main
        id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Test-drive and merge the open release PR
        id: automerge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          prs=$(gh pr list --label "autorelease: pending" --state open --json number --jq '.[].number')
          if [ -z "$prs" ]; then
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "no open release PR -- nothing to merge"
            exit 0
          fi

          merged_any=false
          for pr in $prs; do
            echo "::group::Release PR #$pr"
            gh pr checkout "$pr"

            if ls tests/*.test.js >/dev/null 2>&1; then
              for t in tests/*.test.js; do node "$t"; done
            fi

            # Merge may fail if main moved ahead mid-run (conflict); that's
            # fine -- release-please regenerates the PR on the next push.
            if gh pr merge "$pr" --merge; then
              merged_any=true
            else
              echo "::warning::merge of #$pr failed; will retry on next push"
            fi
            echo "::endgroup::"
          done

          echo "merged=$merged_any" >> "$GITHUB_OUTPUT"

      - name: Check out the merged main
        if: steps.automerge.outputs.merged == 'true'
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Cut the tag + GitHub release from merged main
        if: steps.automerge.outputs.merged == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
